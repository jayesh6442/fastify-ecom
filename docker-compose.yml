version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ecom-postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecom

    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c log_statement=none

    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
