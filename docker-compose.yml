services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-ecom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecom}
      POSTGRES_DB: ${DB_NAME:-ecom}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ecom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ingress_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ingress_net

  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Database connection for app
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-ecom}
      DB_PASSWORD: ${DB_PASSWORD:-ecom}
      DB_NAME: ${DB_NAME:-ecom}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/db/migrations:/app/dist/db/migrations
    command: sh -c "node dist/db/migrate.js && node dist/server.js"
    networks:
      - ingress_net

volumes:
  postgres_data:
  redis_data:

networks:
  ingress_net:
    name: ingress_net
